name: Android APK

on:
  push:
    branches: [main]
    paths: ['frontend/mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['frontend/mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: '后端地址（留空使用仓库变量 API_BASE_URL 或 Android 模拟器默认地址）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            frontend/mobile/android/**/*.gradle.kts
            frontend/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install SQLite test dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build installable test APK
        run: flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Package APK and checksum
        run: |
          mkdir -p build/delivery
          cp build/app/outputs/flutter-apk/app-debug.apk build/delivery/kaifan-android-debug.apk
          cd build/delivery
          sha256sum kaifan-android-debug.apk > kaifan-android-debug.apk.sha256
      - name: Upload Android application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaifan-android-debug-${{ github.run_number }}
          path: frontend/mobile/build/delivery/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
