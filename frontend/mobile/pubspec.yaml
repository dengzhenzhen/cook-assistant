name: kaifan
description: 开饭智能烹饪助手
publish_to: none
version: 0.1.3+4
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  drift: ^2.28.0
  drift_flutter: ^0.2.6
  path_provider: ^2.1.5
  uuid: ^4.5.1
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
